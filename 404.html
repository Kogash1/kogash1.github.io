<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена (404) | Книжный Мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-main">
            <a href="index.html" class="logo">📚 Книжный Мир</a>
            <div class="header-icons">
                <a href="catalog.html" class="btn btn-outline">В каталог</a>
                <a href="index.html" class="btn btn-primary">На главную</a>
            </div>
        </div>
    </header>

    <main class="container" style="text-align:center; padding:70px 20px;">
        <div style="font-size:5rem; font-weight:800; color:var(--primary); line-height:1;">404</div>
        <h1 style="font-size:2rem; margin:16px 0 10px;">Страница не найдена</h1>
        <p style="color:var(--text-muted); max-width:550px; margin:0 auto 30px; font-size:1.05rem;">
            Возможно, страница была перемещена или адрес введен с ошибкой. Воспользуйтесь поиском по каталогу или вернитесь на главную страницу.
        </p>

        <form class="search-box" action="catalog.html" method="get" style="margin:0 auto 30px; max-width:500px;">
            <input type="text" name="q" placeholder="Поиск нужной книги...">
            <button type="submit">Найти</button>
        </form>

        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary">На главную страницу</a>
            <a href="catalog.html" class="btn btn-outline">Каталог книг</a>
            <a href="contacts.html" class="btn btn-outline">Служба поддержки</a>
        </div>
    </main>

    <footer>
        <div class="container footer-bottom">
            <span>© 2026 ООО «Книжный Мир».</span>
            <a href="contacts.html">Контакты</a>
        </div>
    </footer>

</body>
</html>
