    <header>
        <div class="container header-main">
            <a href="index.html" class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>

            <div class="header-icons">
                <a href="catalog.html" class="btn-outline">В каталог</a>
                <a href="login.html" class="btn-login">Войти</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <p class="auth-sub">Присоединяйтесь к клубу читателей и получите 350 приветственных бонусов</p>
            <form onsubmit="event.preventDefault(); alert('Регистрация завершена! Начислено 350 бонусов.'); window.location.href='index.html';">
                <div class="form-field">
                    <label for="reg-name">Имя и фамилия</label>
                    <input type="text" id="reg-name">
                </div>
                <div class="form-field">
                    <label for="reg-email">Электронная почта</label>
                    <input type="email" id="reg-email">
                </div>
                <div class="form-field">
                    <label for="reg-phone">Номер телефона</label>
                    <input type="tel" id="reg-phone">
                </div>
                <div class="form-field">
                    <label for="reg-pass">Пароль</label>
                    <input type="password" id="reg-pass" required placeholder="Не менее 6 символов">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">Создать аккаунт</button>
            </form>
            <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--text-muted);">
                Уже зарегистрированы? <a href="login.html" style="color:var(--primary); font-weight:600;">Войти</a>
            </p>
        </div>
    </main>
